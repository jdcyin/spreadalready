<!-- index.html -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>spreadalready</title>
  <meta content="width=device-width, initial-scale=1" name="viewport" />

  <!-- Social previews -->
  <meta property="og:site_name" content="spreadalready" />
  <meta property="og:title" content="spreadalready" />
  <meta property="og:description" content="A sassy curation of cheeses I've eaten." />
  <meta property="og:type" content="website" />
  <meta name="twitter:card" content="summary" />
  <meta property="twitter:title" content="spreadalready" />
  <meta name="twitter:description" content="A sassy curation of cheeses I've eaten." />

  <meta name="theme-color" content="#FFD700" />

  <!-- Icons -->
  <link href="images/favicon.png" rel="shortcut icon" type="image/x-icon" />
  <link href="images/app-icon.png" rel="apple-touch-icon" />

  <!-- Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Bitter:wght@400;700&family=Inter:wght@400;600;700&family=Libre+Franklin:wght@400;600&display=swap" rel="stylesheet" />

  <!-- Leaflet CSS -->
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
    crossorigin=""
  />

  <!-- Site CSS -->
  <link rel="stylesheet" href="css/spreadalready.css" />
</head>

<body>
  <!-- ABOUT button -->
  <a href="#" class="about-link" id="aboutBtn" role="button" aria-haspopup="dialog" aria-controls="aboutOverlay">
    ABOUT
  </a>

  <!-- ABOUT overlay (backdrop + centered box) -->
  <div class="overlay" id="aboutOverlay" role="dialog" aria-labelledby="aboutTitle" aria-modal="true" hidden>
    <div class="overlay-box" role="document">
      <button class="overlay-close" id="closeOverlay" aria-label="Close about" type="button">×</button>
      <h2 id="aboutTitle">SPREAD ALREADY</h2>
      <p>
        <br />
        A sassy curation of cheeses I've eaten
        <br /><br />
        JY@SPREADALREADY.COM
      </p>
    </div>
  </div>

  <!-- Map -->
  <div id="map" aria-label="Cheese map"></div>

  <!-- Leaflet JS -->
  <script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
    crossorigin=""
  ></script>

  <script>
    // 1) Structured cheese data (uses local /images folder)
    const cheeses = [
      {
        picture: 'images/20251207_boitechaude.JPG',
        name: `Boîte chaude`,
        date: `07 Dec 2025`,
        lat: 46.72756,
        lng: 6.35701,
        region: `Mont d'Or`,
        notes: `Gluey. Lightly salted. Calm without being upsetting. Tame fun (that doesn't last). Like meeting the girlies with newborns you haven't seen in a while`
      },
      {
        picture: 'images/20251207_mangostilton.JPG',
        name: `Mango and Ginger White Stilton`,
        date: `07 Dec 2025`,
        lat: 52.8358,
        lng: 0.9344,
        region: `Long Clawson Dairy, Leicestershire`,
        notes: `Panacotta mango. Pitfruit tones (apricot). Sickly. It says, "Not sure if I like cheese but I like yoghurt"`
      },
      {
        picture: 'images/20260319_camambertdubocage.JPG',
        name: `Camambert du Bocage`,
        date: `19 Mar 2026`,
        lat: 48.699628 ,
        lng: -0.367093,
        region: `Briouze, Normandie, France`,
        notes: `Baked it and dipped into it. Brilliant creamy smoothness.`
      },
      {
        picture: 'images/20260329_lecirdelaubrac.JPG',
        name: `L'ecir de L'aubrac`,
        date: `29 Mar 2026`,
        lat: 44.68905395606905, 
        lng: 2.848092457439639,
        region: `Vergne Plaine, Laguiole, France`,
        notes: `"Soft, feminine, floral. White girl in green house about the orient." <p> "Im getting plaster... wall plaster in particular." <p> "Watered down brie...  the linger. Gayish." <p> "Not goat forward, but goat backwards... goat on the back."`
      },
      {
        picture: 'images/20260329_ecirfraisemballe.JPG',
        name: `Ecir Frais Emballé`,
        date: `29 Mar 2026`,
        lat: 48.09592514914743, 
        lng: -1.4262663372621247,
        region: `Châteaubourg, France`,
        notes: `"Denser than you'd expect." <p> "Cheesecake. Cream cheese? It is cream cheese. Maybe a cashew." <p> "Quite fun and unassuming." <p> "A crowd please... a cheese for the masses. Art Basel reception cheese".`
      },
      {
        picture: 'images/20260329_rocamadourfermier.JPG',
        name: `Rocamadour Fermier`,
        date: `29 Mar 2026`,
        lat: 44.428992279477086,  
        lng: 1.469813705689586,
        region: `Quercy, Lot, France`,
        notes: `"It reminds me of Lunchables, bitter lunchables." <p> "Almond." <p> "Bitter, yes, that's what I said: alkali" <p> "Charred French cheese."`
      },
      {
        picture: 'images/20260329_roquefortlacave.JPG',
        name: `Roquefort La Cave (Wedge)`,
        date: `29 Mar 2026`,
        lat: 43.976171494954016, 
        lng: 2.9905962952642526,
        region: `Roquefort-sur-Soulzon, France`,
        notes: `"It tells you a story." <p> "It's got pops of mould." <p> "I'm getting onion soup... in beef stock" <p> "You're eating cheese then you get a salmon egg." <p> "Yeah, bleu cheese to me. makes me wanna crumble it up and put it in a salad."`
      },
    ];

    // 2) Marker icon helpers
    function markerIcon(color = 'yellow') {
      return new L.Icon({
        iconUrl: `https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-${color}.png`,
        shadowUrl: 'https://unpkg.com/leaflet@1.9.4/dist/images/marker-shadow.png',
        iconSize: [25, 41],
        iconAnchor: [12, 41],
        popupAnchor: [1, -34],   // default Leaflet behavior: popup above marker
        shadowSize: [41, 41]
      });
    }

    const pin = markerIcon('yellow');

    // 3) Initialise map
    const map = L.map('map');

    const tiles = L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
      maxZoom: 19,
      attribution: '&copy; OpenStreetMap contributors &copy; CARTO'
    }).addTo(map);

    // Fix "first click" autopan issues by forcing Leaflet to measure correctly
    window.addEventListener('load', () => {
      map.invalidateSize(true);
    });

    window.addEventListener('resize', () => {
      map.invalidateSize(true);
    });

    // Also after tiles load (extra robust)
    tiles.on('load', () => {
      map.invalidateSize(true);
    });

    const group = L.featureGroup().addTo(map);

    // 4) Render popup HTML dynamically
    function renderPopup(entry) {
      const imgHtml = entry.picture
        ? `<img class="popup-img" src="${entry.picture}" alt="${entry.name}">`
        : '';

      return `
        <div class="popup">
          ${imgHtml}

          <div class="popup-row">
            <span class="popup-label">Cheese name:</span>
            <span class="popup-value">${entry.name}</span>
          </div>

          <div class="popup-row">
            <span class="popup-label">Date:</span>
            <span class="popup-value">${entry.date || '—'}</span>
          </div>

          <div class="popup-row">
            <span class="popup-label">Region:</span>
            <span class="popup-value">${entry.region || '—'}</span>
          </div>

          <div class="popup-row">
            <span class="popup-label">Tasting notes:</span>
            <span class="popup-value popup-notes">${entry.notes || '—'}</span>
          </div>
        </div>
      `;
    }

    // 5) Add markers and popups (autopan padding prevents top clipping)
    cheeses.forEach((c) => {
      L.marker([c.lat, c.lng], { icon: pin })
        .addTo(group)
        .bindPopup(renderPopup(c), {
          maxWidth: 360,
          autoPan: true,
          keepInView: true,

          // give room for the top edge + ABOUT button
          autoPanPaddingTopLeft: L.point(24, 90),
          autoPanPaddingBottomRight: L.point(24, 24)
        });
    });

    // 6) Initial view
    map.setView([49.8175, 15.4730], 3);

    // 7) ABOUT overlay logic (X, Esc, and click outside)
    const aboutBtn = document.getElementById('aboutBtn');
    const aboutOverlay = document.getElementById('aboutOverlay');
    const closeOverlay = document.getElementById('closeOverlay');
    const overlayBox = aboutOverlay.querySelector('.overlay-box');

    function openAbout() {
	map.closePopup(); // closes any open cheese popup
      aboutOverlay.hidden = false;
      closeOverlay.focus();
    }

    function closeAbout() {
      aboutOverlay.hidden = true;
      aboutBtn.focus();
    }

    aboutBtn.addEventListener('click', (e) => {
      e.preventDefault();
      openAbout();
    });

    closeOverlay.addEventListener('click', closeAbout);

    document.addEventListener('keydown', (e) => {
      if (!aboutOverlay.hidden && (e.key === 'Escape' || e.key === 'Esc')) closeAbout();
    });

    // Click outside the box closes
    aboutOverlay.addEventListener('click', (e) => {
      if (!overlayBox.contains(e.target)) closeAbout();
    });
  </script>
</body>
</html>
