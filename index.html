<!-- index.html -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>spreadalready: cheese atlas</title>
  <meta content="width=device-width, initial-scale=1" name="viewport" />

  <!-- Social previews -->
  <meta property="og:site_name" content="SpreadAlready" />
  <meta property="og:title" content="SpreadAlready" />
  <meta property="og:description" content="A sassy curation of cheeses I've eaten." />
  <meta property="og:url" content="https://www.spreadalready.com" />
  <meta property="og:type" content="website" />
  <meta name="twitter:card" content="summary" />
  <meta property="twitter:title" content="SpreadAlready" />
  <meta name="twitter:description" content="A sassy curation of cheeses I've eaten." />

  <meta name="theme-color" content="#FAF7F1" />

  <!-- Icons -->
  <link href="images/favicon.png" rel="shortcut icon" type="image/x-icon" />
  <link href="images/app-icon.png" rel="apple-touch-icon" />

  <!-- Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Libre+Franklin:wght@400;500;700;800&display=swap" rel="stylesheet" />

  <!-- Site CSS -->
  <link rel="stylesheet" href="css/spreadalready.css" />
</head>

<body>
  <div id="app">
    <button class="about-btn" id="aboutBtn" type="button" aria-haspopup="dialog" aria-controls="aboutOverlay" aria-label="About">?</button>
    <button class="theme-toggle" id="themeToggle" type="button" aria-label="Switch to light mode"></button>

    <div id="globeContainer" class="globe-container" aria-label="Interactive globe of cheeses I've eaten"></div>

    <div class="drag-hint" id="dragHint">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg>
      Drag to explore
    </div>

    <!-- ABOUT overlay -->
    <div class="about-overlay" id="aboutOverlay" role="dialog" aria-modal="true" aria-labelledby="aboutTitle" hidden>
      <div class="about-box">
        <button class="overlay-close" id="aboutClose" type="button" aria-label="Close">&times;</button>
        <p class="about-title" id="aboutTitle">SPREAD &middot; ALREADY</p>
        <p class="about-tagline">Sassy atlas of cheeses I've eaten</p>
        <div class="about-email">jy@spreadalready.com</div>
      </div>
    </div>

    <!-- Leader line from marker to cheese card (desktop only) -->
    <svg id="leaderLine" class="leader-line hidden" aria-hidden="true">
      <line id="leaderLineStroke" x1="0" y1="0" x2="0" y2="0"></line>
      <circle id="leaderLineDot" r="3.5" cx="0" cy="0"></circle>
    </svg>

    <!-- Cheese detail card (desktop callout / mobile bottom sheet) -->
    <div class="card-panel" id="cardPanel" role="dialog" aria-modal="true" hidden>
      <div class="sheet-handle" aria-hidden="true"></div>
      <button class="card-close" id="cardClose" type="button" aria-label="Close">&times;</button>
      <div id="cardBody"></div>
    </div>
  </div>

  <!-- globe.gl (bundles Three.js + three-globe) -->
  <script src="https://unpkg.com/globe.gl@2.46.2/dist/globe.gl.min.js"></script>

  <script src="js/spreadalready.js"></script>
</body>
</html>
